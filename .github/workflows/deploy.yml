name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Normalize FTP host
        env:
          FTP_HOST_RAW: ${{ secrets.FTP_HOST }}
        run: |
          FTP_HOST_CLEAN="$(echo "$FTP_HOST_RAW" | tr -d '\r\n' | xargs)"
          FTP_HOST_CLEAN="${FTP_HOST_CLEAN#ftp://}"
          FTP_HOST_CLEAN="${FTP_HOST_CLEAN#ftps://}"
          FTP_HOST_CLEAN="${FTP_HOST_CLEAN%%/*}"
          FTP_HOST_CLEAN="${FTP_HOST_CLEAN%%:*}"
          echo "FTP_HOST_CLEAN=$FTP_HOST_CLEAN" >> "$GITHUB_ENV"

      - name: Validate FTP host DNS
        run: |
          if [ -z "$FTP_HOST_CLEAN" ]; then
            echo "Secret FTP_HOST is empty."
            exit 1
          fi

          if ! getent ahosts "$FTP_HOST_CLEAN" >/dev/null; then
            echo "Could not resolve FTP_HOST. Use hostname or IP only."
            echo "Examples: ftp.seudominio.com or 195.200.3.144"
            echo "Do not include protocol, path, or port in FTP_HOST."
            exit 1
          fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ env.FTP_HOST_CLEAN }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: dist/
          protocol: ftps
          port: 21
