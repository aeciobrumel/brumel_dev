name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Normalize FTP connection settings
        env:
          FTP_HOST_RAW: ${{ secrets.FTP_HOST }}
          FTP_PORT_RAW: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL_RAW: ${{ secrets.FTP_PROTOCOL }}
          FTP_SERVER_DIR_RAW: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          FTP_TARGET="$(echo "$FTP_HOST_RAW" | tr -d '\r\n' | xargs)"
          FTP_TARGET="${FTP_TARGET#ftp://}"
          FTP_TARGET="${FTP_TARGET#ftps://}"
          FTP_TARGET="${FTP_TARGET%%/*}"

          FTP_HOST_CLEAN="$FTP_TARGET"
          FTP_PORT_CLEAN="$(echo "${FTP_PORT_RAW:-}" | tr -d '\r\n' | xargs)"
          if [ -z "$FTP_PORT_CLEAN" ] && [[ "$FTP_TARGET" == *:* ]]; then
            FTP_PORT_CLEAN="${FTP_TARGET##*:}"
            FTP_HOST_CLEAN="${FTP_TARGET%:*}"
          fi
          if [ -z "$FTP_PORT_CLEAN" ]; then
            FTP_PORT_CLEAN=21
          fi

          FTP_PROTOCOL_CLEAN="$(echo "${FTP_PROTOCOL_RAW:-ftps}" | tr -d '\r\n' | xargs | tr '[:upper:]' '[:lower:]')"
          if [ "$FTP_PROTOCOL_CLEAN" != "ftp" ] && [ "$FTP_PROTOCOL_CLEAN" != "ftps" ]; then
            echo "Invalid FTP_PROTOCOL. Use ftp or ftps."
            exit 1
          fi

          FTP_SERVER_DIR_CLEAN="$(echo "${FTP_SERVER_DIR_RAW:-./}" | tr -d '\r\n' | xargs)"
          if [ -z "$FTP_SERVER_DIR_CLEAN" ]; then
            FTP_SERVER_DIR_CLEAN="./"
          fi
          case "$FTP_SERVER_DIR_CLEAN" in
            */) ;;
            *) FTP_SERVER_DIR_CLEAN="${FTP_SERVER_DIR_CLEAN}/" ;;
          esac

          echo "FTP_HOST_CLEAN=$FTP_HOST_CLEAN" >> "$GITHUB_ENV"
          echo "FTP_PORT_CLEAN=$FTP_PORT_CLEAN" >> "$GITHUB_ENV"
          echo "FTP_PROTOCOL_CLEAN=$FTP_PROTOCOL_CLEAN" >> "$GITHUB_ENV"
          echo "FTP_SERVER_DIR_CLEAN=$FTP_SERVER_DIR_CLEAN" >> "$GITHUB_ENV"

      - name: Validate FTP host DNS
        run: |
          if [ -z "$FTP_HOST_CLEAN" ]; then
            echo "Secret FTP_HOST is empty."
            exit 1
          fi

          if ! getent ahosts "$FTP_HOST_CLEAN" >/dev/null; then
            echo "Could not resolve FTP_HOST. Use hostname or IP only."
            echo "Examples: ftp.seudominio.com or 195.200.3.144"
            echo "FTP_HOST may optionally include :port, or you can set FTP_PORT separately."
            exit 1
          fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ env.FTP_HOST_CLEAN }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR_CLEAN }}
          local-dir: dist/
          protocol: ${{ env.FTP_PROTOCOL_CLEAN }}
          port: ${{ env.FTP_PORT_CLEAN }}
